apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: shared-gateway
  namespace: gateway-system
spec:
  gatewayClassName: <YOUR_KGATEWAY_GATEWAYCLASS>

  listeners:

  - name: https-a
    protocol: HTTPS
    port: 443
    hostname: a.example.test
    tls:
      mode: Terminate
      certificateRefs:
      - kind: Secret
        name: tls-a
    allowedRoutes:
      namespaces:
        from: Selector
        selector:
          matchLabels:
            gateway-access: "true"

  - name: https-b
    protocol: HTTPS
    port: 443
    hostname: b.example.test
    tls:
      mode: Terminate
      certificateRefs:
      - kind: Secret
        name: tls-b
    allowedRoutes:
      namespaces:
        from: Selector
        selector:
          matchLabels:
            gateway-access: "true"

  - name: https-c
    protocol: HTTPS
    port: 443
    hostname: c.example.test
    tls:
      mode: Terminate
      certificateRefs:
      - kind: Secret
        name: tls-c
    allowedRoutes:
      namespaces:
        from: Selector
        selector:
          matchLabels:
            gateway-access: "true"
