apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: attack-to-b
  namespace: tenant-a
spec:
  parentRefs:
  - name: shared-gateway
    namespace: gateway-system

  hostnames:
  - attack-a.example.test

  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /

    backendRefs:
    - name: app-b
      namespace: tenant-b
      port: 80
