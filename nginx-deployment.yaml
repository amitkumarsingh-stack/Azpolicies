apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-a
  namespace: tenant-a
spec:
  replicas: 2
  selector:
    matchLabels:
      app: app-a
  template:
    metadata:
      labels:
        app: app-a
    spec:
      containers:
      - name: app
        image: hashicorp/http-echo:1.0
        args:
        - "-text=TENANT-A"
        ports:
        - containerPort: 5678
---
apiVersion: v1
kind: Service
metadata:
  name: app-a
  namespace: tenant-a
spec:
  selector:
    app: app-a
  ports:
  - port: 80
    targetPort: 5678
